version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: compilex-redis
    ports:
      - "6379:6379"
    networks:
      - compilex-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: compilex-backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - REDIS_HOST=redis
      - GEMINI_API=${GEMINI_API}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./backend:/app
    depends_on:
      - redis
    networks:
      - compilex-network

networks:
  compilex-network:
    driver: bridge
